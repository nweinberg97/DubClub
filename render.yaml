# Render Blueprint — the Dub Club service (API + studio + landing).
# In Render: New → Blueprint → pick this repo. Every push to main redeploys.
services:
  - type: web
    name: dubclub
    runtime: docker
    plan: free # free tier: sleeps after ~15 min idle, first request then takes ~1 min to wake
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      # Recordings are temporary (deleted after 60 min), so local scratch space is enough on the free tier.
      - key: DATA_DIR
        value: /tmp/dubclub-data
      - key: ENGINE
        value: elevenlabs # voice swap via ElevenLabs; switch to remote once a true accent model is connected
      # Paste your ElevenLabs API key when Render asks (never commit it).
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_sts_v2
      # ElevenLabs default voices: George (British), Charlie (Australian), Brian (American)
      - key: ELEVENLABS_VOICES
        value: en-GB:JBFqnCBsd6RMkjVDRZzb,en-AU:IKne3meq5aSn9XLyUdCD,en-US:nPczCjzI2devNBz1zQrb
      - key: TRUST_PROXY
        value: '1'
      - key: RETENTION_MINUTES
        value: '60'
      # Lets the GitHub Pages copy of the site call this service.
      - key: ALLOWED_ORIGINS
        value: https://nweinberg97.github.io
      - key: REMOTE_ENGINE_URL
        sync: false
      - key: REMOTE_ENGINE_KEY
        sync: false
