name: probe
on:
  push:
    branches: [engine-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - working-directory: probe
        run: npm install 2>&1 | tail -3 && node probe.mjs > log.txt 2>&1 || true
      - name: Publish results to a branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp probe/log.txt probe/*.wav /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q -b r && git add -A && git -c user.name=ci -c user.email=ci@x commit -qm results
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r:probe-results
