# Publishes the web app to GitHub Pages. The dubbing engine runs in the visitor's browser,
# so no server is needed. Settings → Pages → Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Engine packages present
        run: test -f node_modules/kokoro-js/package.json && test -f node_modules/@huggingface/transformers/package.json
      - name: Build for Pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          STATIC_HOST: '1'
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
