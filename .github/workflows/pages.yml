# Publishes the web app to GitHub Pages. The studio talks to the Dub Club service on Render.
# Settings → Pages → Source: "GitHub Actions".
# Settings → Secrets and variables → Actions → Variables: API_ORIGIN = your Render URL (if not the default below).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build for Pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          API_ORIGIN: ${{ vars.API_ORIGIN || 'https://dubclub.onrender.com' }}
          STATIC_HOST: '1'
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
